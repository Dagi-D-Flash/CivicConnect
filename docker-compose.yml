version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicconnect_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - civicconnect

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: civicconnect_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - civicconnect
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: civicconnect_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-civicconnect}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-civicconnect}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - civicconnect

  # Redis
  redis:
    image: redis:alpine
    container_name: civicconnect_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - civicconnect

  # MailHog (for email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: civicconnect_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - civicconnect

networks:
  civicconnect:
    driver: bridge

volumes:
  mysql_data:
    driver: local
